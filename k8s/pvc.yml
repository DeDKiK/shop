# PersistentVolumeClaim for MongoDB
# Ensures data survives pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: shop
  labels:
    app: shop
    component: mongodb
    tier: data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: standard  # uncomment and set for your cluster (e.g. gp2 on AWS, standard on minikube)