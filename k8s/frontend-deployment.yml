apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  namespace: shop
  labels:
    app: shop
    component: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
      component: frontend
  template:
    metadata:
      labels:
        app: shop
        component: frontend
    spec:
      containers:
      - name: frontend
        image: shop-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: shop-frontend
  namespace: shop
  labels:
    app: shop
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: shop
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP