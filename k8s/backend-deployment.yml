# Backend Deployment for Shop Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-backend
  namespace: shop
  labels:
    app: shop
    component: backend
    tier: application
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: shop
      component: backend

  template:
    metadata:
      labels:
        app: shop
        component: backend
        tier: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"

    spec:
      containers:
      - name: backend
        image: shop-backend:latest
        imagePullPolicy: IfNotPresent  

        ports:
        - name: http
          containerPort: 5000
          protocol: TCP

        envFrom:
        - configMapRef:
            name: shop-backend-config

        env:
        - name: MONGODB_USER
          valueFrom:
            secretKeyRef:
              name: shop-backend-secret
              key: MONGODB_USER
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shop-backend-secret
              key: MONGODB_PASSWORD

        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        securityContext:
          readOnlyRootFilesystem: false
          runAsNonRoot: true       # fixed: don't run as root
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

      securityContext:
        fsGroup: 1000

---
# MongoDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-mongodb
  namespace: shop
  labels:
    app: shop
    component: mongodb
    tier: data
spec:
  replicas: 1

  selector:
    matchLabels:
      app: shop
      component: mongodb

  template:
    metadata:
      labels:
        app: shop
        component: mongodb
        tier: data

    spec:
      containers:
      - name: mongodb
        image: mongo:7
        imagePullPolicy: IfNotPresent

        ports:
        - name: mongodb
          containerPort: 27017
          protocol: TCP

        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: shop-backend-secret
              key: MONGODB_USER
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shop-backend-secret
              key: MONGODB_PASSWORD
        - name: MONGO_INITDB_DB
          value: "shop"

        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db

        livenessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc  # fixed: use PVC instead of emptyDir