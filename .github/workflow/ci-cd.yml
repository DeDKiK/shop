name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull request:
    branches: [main, master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permisions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

        #=============== NODE.JS SETUP ================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install


      #=============== FRONTEND ================

      -name: Install & Build Frontend
        run: |
          npm ci

      -name: build frontend
        run: npm run build
        