name: Infra (Terraform + Ansible)

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/shop-key
          chmod 600 ~/.ssh/shop-key
          ssh-keygen -y -f ~/.ssh/shop-key > ~/.ssh/shop-key.pub

      - name: Detect runner public IP
        id: runner_ip
        run: echo "ip=$(curl -s https://ifconfig.me)" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: IaC/terraform/infra
        run: terraform init

      - name: Terraform apply
        working-directory: IaC/terraform/infra
        run: terraform apply -auto-approve -var="my_ip=${{ steps.runner_ip.outputs.ip }}"

      - name: Setup Ansible
        run: pip install ansible --break-system-packages

      - name: Run Ansible playbook
        working-directory: IaC/ansible
        run: |
          chmod +x inventory/terraform_inventory.py
          ansible-playbook playbooks/site.yml